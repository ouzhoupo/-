name: CI
on:
  push:
    branches: [ main, add-ci-docker-scripts ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Smoke run (help)
        run: python code/s1s2_pond_production.py --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      - name: Install minimal tooling
        run: |
          python -m pip install --upgrade pip
          pip install flake8 || true
      - name: Run flake8 (non-fatal)
        run: flake8 || true
